services:
  php:
    build: .
    container_name: lab7_php
    volumes:
      - ./www:/var/www/html
    expose:
      - "9000"
    depends_on:
      - kafka
      - mysql
    networks:
      - lab7_network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: lab7_zookeeper
    ports:
      - "2181:2181"
    networks:
      - lab7_network

  kafka:
    image: wurstmeister/kafka:latest
    container_name: lab7_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "lab7_topic:1:1,lab7_error_topic:1:1"
    depends_on:
      - zookeeper
    networks:
      - lab7_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:alpine
    container_name: lab7_nginx
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - lab7_network

  mysql:
    image: mysql:8.0
    container_name: lab7_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: lab7_db
      MYSQL_USER: lab7_user
      MYSQL_PASSWORD: lab7_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lab7_network

networks:
  lab7_network:
    driver: bridge

volumes:
  mysql_data: